version: 2

project_name: gh-prx

before:
  hooks:
    - go mod tidy

builds:
  - id: gh-prx
    main: ./cmd/gh-prx
    binary: gh-prx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: gh-patch
    main: ./cmd/gh-patch
    binary: gh-patch
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

brews:
  - name: gh-prx
    repository:
      owner: s4na
      name: homebrew-tap
    homepage: https://github.com/s4na/gh-patch
    description: Read and update named Markdown blocks in GitHub pull requests
    install: |
      bin.install "gh-prx"
    test: |
      system "#{bin}/gh-prx", "--help"
